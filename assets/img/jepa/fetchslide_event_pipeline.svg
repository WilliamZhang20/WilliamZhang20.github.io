<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
  <title id="title">FetchSlide event-model planning pipeline</title>
  <desc id="desc">A pre-impact state and candidate strike macros are encoded into a JEPA latent and goal-frame features. An ensemble endpoint predictor estimates resting puck positions and uncertainty, then selects and executes the lowest-cost strike.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#365c6e"/></marker>
    <style>.title{font:700 36px Arial,sans-serif;fill:#172554}.label{font:700 20px Arial,sans-serif;fill:#172554}.body{font:400 17px Arial,sans-serif;fill:#334155}.small{font:400 15px Arial,sans-serif;fill:#475569}.formula{font:italic 18px Georgia,serif;fill:#334155}</style>
  </defs>
  <rect width="1400" height="600" fill="#fff"/>
  <text x="55" y="58" class="title">FetchSlide: predict the event endpoint, then commit to one strike</text>
  <g stroke-width="3">
    <rect x="55" y="112" width="260" height="145" rx="18" fill="#e0f2fe" stroke="#0284c7"/><rect x="55" y="348" width="260" height="145" rx="18" fill="#fef3c7" stroke="#d97706"/>
    <rect x="440" y="112" width="260" height="145" rx="18" fill="#e0e7ff" stroke="#4f46e5"/><rect x="440" y="348" width="260" height="145" rx="18" fill="#f3e8ff" stroke="#9333ea"/>
    <rect x="825" y="198" width="270" height="205" rx="18" fill="#dcfce7" stroke="#16a34a"/><rect x="1190" y="198" width="160" height="205" rx="18" fill="#ffe4e6" stroke="#e11d48"/>
  </g>
  <g text-anchor="middle">
    <text x="185" y="153" class="label">Pre-impact state</text><text x="185" y="188" class="body">gripper, puck, goal</text><text x="185" y="218" class="formula">s₍impact₎</text>
    <text x="185" y="389" class="label">Candidate strike macros</text><text x="185" y="424" class="body">direction, amplitude, duration</text><text x="185" y="456" class="formula">m = [dₓ, dᵧ, α, τ]</text>
    <text x="570" y="153" class="label">JEPA encoder</text><text x="570" y="188" class="body">encodes the pre-impact state</text><text x="570" y="218" class="formula">z₍impact₎</text>
    <text x="570" y="383" class="label">Goal-frame features</text><text x="570" y="413" class="body">contact geometry, velocities, strike</text><text x="570" y="441" class="body">goal-aligned coordinates + Fourier basis</text><text x="570" y="471" class="small">forward = toward goal; sideways = perpendicular</text>
    <text x="960" y="241" class="label">Event endpoint ensemble</text><text x="960" y="276" class="body">gated residual predictor</text><text x="960" y="312" class="formula">K resting-endpoint predictions</text><text x="960" y="348" class="small">mean endpoint and disagreement</text>
    <text x="1270" y="238" class="label">Select and execute</text><text x="1270" y="274" class="body">lowest endpoint error</text><text x="1270" y="302" class="body">+ uncertainty</text><text x="1270" y="343" class="body">strike, lift, coast</text>
  </g>
  <g stroke="#365c6e" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M315 185H440"/><path d="M315 421H440"/><path d="M700 185C760 185 770 255 825 278"/><path d="M700 421C760 421 770 355 825 332"/><path d="M1095 300H1190"/>
  </g>
</svg>
